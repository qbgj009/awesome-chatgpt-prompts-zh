<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>地牢推箱子 · H5</title>
  <style>
    :root {
      --bg: #1d2330;
      --panel: #20283a;
      --gold: #f6c667;
      --accent: #5ed0ff;
      --danger: #ff6363;
      --ok: #79df9b;
      --tile: 58px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #34435f, var(--bg));
      color: #eef4ff;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px;
      overflow-x: hidden;
    }
    h1 {
      margin: 6px 0 2px;
      color: #ffe9a7;
      text-shadow: 0 2px 0 #7a4e1a;
      font-size: clamp(20px, 3.2vw, 30px);
      letter-spacing: 1px;
    }
    .hud {
      width: min(96vw, 860px);
      background: linear-gradient(180deg, #2a3550, #1f2635);
      border: 2px solid #445273;
      border-radius: 16px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,.33);
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: #111826;
      border: 1px solid #3f4d6d;
      font-size: 13px;
      white-space: nowrap;
    }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: end; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      color: #112;
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(180deg, #ffd985, #f2b85b);
      box-shadow: 0 3px 0 #9f6a2c;
    }
    button.secondary {
      color: #d8e6ff;
      background: linear-gradient(180deg, #50658f, #344464);
      box-shadow: 0 3px 0 #1f2b46;
    }
    #levelSelect { display: flex; flex-wrap: wrap; gap: 8px; width: min(96vw, 860px); }
    #levelSelect button.active { outline: 3px solid var(--accent); }

    .game-wrap {
      perspective: 900px;
      transform-style: preserve-3d;
      width: min(96vw, 860px);
      display: grid;
      place-items: center;
    }
    #game {
      touch-action: none;
      border-radius: 20px;
      border: 2px solid #556285;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
      background: #1f2a1c;
      width: min(94vw, 780px);
      height: auto;
      transform: rotateX(14deg);
    }
    .tips {
      width: min(96vw, 860px);
      background: rgba(23,30,43,.8);
      border: 1px solid #3d4c6f;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .danger { color: #ff9d9d; }
    .ok { color: #a4ffc2; }
  </style>
</head>
<body>
  <h1>🧩 地牢推箱子（3渲2风格）</h1>
  <div class="hud">
    <div class="stats">
      <span class="chip" id="levelInfo">关卡：1</span>
      <span class="chip" id="boxInfo">箱子：0</span>
      <span class="chip" id="stepInfo">步数：0</span>
      <span class="chip" id="goalInfo">完成：0/0</span>
      <span class="chip" id="propInfo">道具：炸弹0 / 传送0</span>
      <span class="chip" id="stateInfo">状态：进行中</span>
    </div>
    <div class="buttons">
      <button id="undoBtn" class="secondary">撤销</button>
      <button id="restartBtn" class="secondary">重开</button>
      <button id="bombBtn" class="secondary">炸弹</button>
      <button id="teleportBtn" class="secondary">传送</button>
      <button id="nextBtn">下一关</button>
    </div>
  </div>

  <div id="levelSelect"></div>

  <div class="game-wrap">
    <canvas id="game" width="780" height="540"></canvas>
  </div>

  <div class="tips">
    操作：<b>方向键 / WASD / 触屏滑动</b>。规则：只能推不能拉，一次最多推一个箱子。<br/>
    <span class="danger">地刺</span>：玩家踩到会失败并重开当前关。<span class="danger">角落警告</span>：若箱子被推入非目标死角将高亮提示。<br/>
    <span class="ok">道具</span>：按 <b>B</b> 使用炸弹清除相邻箱子；按 <b>T</b> 使用传送随机换位（每关次数有限）。<br/>
    <span class="ok">通关条件</span>：所有箱子都到目标点（绿色符文）上。
  </div>

  <script>
    const TILE = 60;
    const TYPES = { WALL:'#', FLOOR:'.', GOAL:'G', PLAYER:'P', BOX:'B', SPIKE:'S', DUNGEON:'D', PORTAL:'T' };

    const LEVELS = [
      {
        name: '新手试炼 · 1箱',
        bombs: 0,
        teleports: 0,
        map: [
          '##########',
          '#........#',
          '#..G.....#',
          '#..B.....#',
          '#..P.....#',
          '#........#',
          '##########'
        ]
      },
      {
        name: '地牢回廊 · 2箱',
        bombs: 1,
        teleports: 0,
        map: [
          '###########',
          '#....D....#',
          '#..G..G...#',
          '#..B..B...#',
          '#.....P...#',
          '#....S....#',
          '###########'
        ]
      },
      {
        name: '尖刺错位 · 3箱',
        bombs: 1,
        teleports: 1,
        map: [
          '############',
          '#..G....G..#',
          '#..B.##.B..#',
          '#....S.....#',
          '#..##.T##..#',
          '#..B....G..#',
          '#....P.....#',
          '#...D...T..#',
          '############'
        ]
      },
      {
        name: '监牢迷宫 · 4箱',
        bombs: 1,
        teleports: 1,
        map: [
          '#############',
          '#G....#....G#',
          '#B.B..#..B.B#',
          '#.....#.....#',
          '#..###S###..#',
          '#....DP.....#',
          '#.....#.....#',
          '#G....#....G#',
          '#############'
        ]
      },
      {
        name: '大师挑战 · 5箱',
        bombs: 2,
        teleports: 1,
        map: [
          '##############',
          '#G...#..#...G#',
          '#B.B.#S.#.B.B#',
          '#....#..#....#',
          '#.##T####T##.#',
          '#....D..D....#',
          '#..B....B....#',
          '#....#P.#....#',
          '#G...#..#...G#',
          '##############'
        ]
      }
    ];

    const state = {
      levelIndex: 0,
      grid: [],
      goals: new Set(),
      spikes: new Set(),
      dungeons: new Set(),
      portals: [],
      boxes: new Set(),
      player: {x:0,y:0},
      steps: 0,
      bombs: 0,
      teleports: 0,
      history: [],
      failed: false,
      deadlockedBoxes: new Set(),
      lastDir: {x:0,y:1},
      message: '状态：进行中',
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const info = {
      level: document.getElementById('levelInfo'),
      box: document.getElementById('boxInfo'),
      step: document.getElementById('stepInfo'),
      goal: document.getElementById('goalInfo'),
      prop: document.getElementById('propInfo'),
      state: document.getElementById('stateInfo'),
    };

    function toKey(x,y){ return `${x},${y}`; }
    function fromKey(k){ const [x,y]=k.split(',').map(Number); return {x,y}; }

    function loadLevel(index) {
      state.levelIndex = index;
      state.grid = [];
      state.goals.clear(); state.spikes.clear(); state.dungeons.clear(); state.boxes.clear(); state.portals = [];
      state.steps = 0; state.history = []; state.failed = false;
      state.bombs = LEVELS[index].bombs || 0;
      state.teleports = LEVELS[index].teleports || 0;
      state.message = '状态：进行中';

      const rows = LEVELS[index].map;
      const h = rows.length;
      const w = rows[0].length;
      canvas.width = w * TILE;
      canvas.height = h * TILE;

      rows.forEach((row, y) => {
        state.grid[y] = [];
        [...row].forEach((ch, x) => {
          let ground = TYPES.FLOOR;
          if (ch === TYPES.WALL) ground = TYPES.WALL;
          if (ch === TYPES.GOAL) state.goals.add(toKey(x,y));
          if (ch === TYPES.SPIKE) state.spikes.add(toKey(x,y));
          if (ch === TYPES.DUNGEON) state.dungeons.add(toKey(x,y));
          if (ch === TYPES.PORTAL) state.portals.push({x,y});
          if (ch === TYPES.BOX) state.boxes.add(toKey(x,y));
          if (ch === TYPES.PLAYER) state.player = {x,y};
          state.grid[y][x] = ground;
        });
      });

      computeDeadlocks();
      refreshLevelButtons();
      updateHUD();
      draw();
    }

    function pushHistory(){
      state.history.push({
        player: {...state.player},
        boxes: new Set([...state.boxes]),
        steps: state.steps,
        failed: state.failed,
        bombs: state.bombs,
        teleports: state.teleports,
        message: state.message,
      });
      if (state.history.length > 80) state.history.shift();
    }

    function restore(snapshot){
      state.player = {...snapshot.player};
      state.boxes = new Set([...snapshot.boxes]);
      state.steps = snapshot.steps;
      state.failed = snapshot.failed;
      state.bombs = snapshot.bombs;
      state.teleports = snapshot.teleports;
      state.message = snapshot.message;
      computeDeadlocks();
      updateHUD();
      draw();
    }

    function isWall(x,y){
      return y < 0 || y >= state.grid.length || x < 0 || x >= state.grid[0].length || state.grid[y][x] === TYPES.WALL;
    }
    function hasBox(x,y){ return state.boxes.has(toKey(x,y)); }

    function move(dx,dy){
      if (state.failed || isWin()) return;
      state.lastDir = {x:dx,y:dy};
      const nx = state.player.x + dx;
      const ny = state.player.y + dy;
      if (isWall(nx,ny)) return;

      const destKey = toKey(nx,ny);
      if (hasBox(nx,ny)) {
        const bx = nx + dx, by = ny + dy;
        if (isWall(bx,by) || hasBox(bx,by)) return; // 一次仅推一个
        pushHistory();
        state.boxes.delete(destKey);
        state.boxes.add(toKey(bx,by));
        state.player = {x:nx,y:ny};
        state.steps++;
        state.message = '状态：进行中';
      } else {
        pushHistory();
        state.player = {x:nx,y:ny};
        state.steps++;
        state.message = '状态：进行中';
      }

      if (state.spikes.has(toKey(state.player.x,state.player.y))) {
        state.failed = true;
        state.message = '状态：踩中地刺，失败！';
        setTimeout(() => loadLevel(state.levelIndex), 700);
      }

      tryPortal();

      computeDeadlocks();
      updateHUD();
      draw();
      if (isWin()) {
        state.message = '状态：通关成功 🎉';
        updateHUD();
      }
    }

    function tryPortal(){
      const here = toKey(state.player.x, state.player.y);
      if (state.portals.length < 2) return;
      const idx = state.portals.findIndex(p => toKey(p.x,p.y) === here);
      if (idx === -1) return;
      const target = state.portals[(idx + 1) % state.portals.length];
      if (!hasBox(target.x, target.y)) {
        state.player = {x: target.x, y: target.y};
        state.message = '状态：进入传送门！';
      }
    }

    function isCornerBlocked(x,y){
      const up = isWall(x, y-1) || hasBox(x, y-1);
      const down = isWall(x, y+1) || hasBox(x, y+1);
      const left = isWall(x-1, y) || hasBox(x-1, y);
      const right = isWall(x+1, y) || hasBox(x+1, y);
      return (up && left) || (up && right) || (down && left) || (down && right);
    }

    function computeDeadlocks(){
      state.deadlockedBoxes.clear();
      for (const k of state.boxes) {
        if (state.goals.has(k)) continue;
        const {x,y} = fromKey(k);
        if (isCornerBlocked(x,y)) state.deadlockedBoxes.add(k);
      }
    }

    function isWin(){
      for (const g of state.goals) if (!state.boxes.has(g)) return false;
      return true;
    }

    function drawTile3D(x,y,colorTop,colorSide){
      const px = x*TILE, py = y*TILE;
      ctx.fillStyle = colorSide;
      ctx.fillRect(px, py+6, TILE, TILE-6);
      ctx.fillStyle = colorTop;
      ctx.fillRect(px+2, py, TILE-4, TILE-8);
      ctx.strokeStyle = 'rgba(0,0,0,.18)';
      ctx.strokeRect(px+2, py, TILE-4, TILE-8);
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      for (let y=0; y<state.grid.length; y++) {
        for (let x=0; x<state.grid[0].length; x++) {
          const key = toKey(x,y);
          const px=x*TILE, py=y*TILE;
          if (state.grid[y][x] === TYPES.WALL) {
            drawTile3D(x,y,'#9ca9bc','#6d788d');
            continue;
          }

          // grass-like floor
          const grd = ctx.createLinearGradient(px,py,px,py+TILE);
          grd.addColorStop(0,'#7bd16b'); grd.addColorStop(1,'#4ea94b');
          ctx.fillStyle = grd;
          ctx.fillRect(px, py, TILE, TILE);

          // checker highlight for pseudo 3D
          if ((x+y)%2===0){
            ctx.fillStyle='rgba(255,255,255,.08)';
            ctx.fillRect(px,py,TILE,TILE);
          }

          if (state.dungeons.has(key)) {
            ctx.fillStyle = '#1a1f28';
            ctx.fillRect(px+8,py+8,TILE-16,TILE-16);
            ctx.strokeStyle = '#6d7481';
            for(let i=0;i<4;i++){
              const gx=px+12+i*10;
              ctx.beginPath();
              ctx.moveTo(gx,py+8);
              ctx.lineTo(gx,py+TILE-8);
              ctx.stroke();
            }
            ctx.fillStyle = '#7bff67';
            ctx.beginPath();
            ctx.arc(px+TILE/2, py+TILE/2, 9, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle='#fff';
            ctx.beginPath();ctx.arc(px+TILE/2-4,py+TILE/2-2,2,0,Math.PI*2);ctx.fill();
            ctx.beginPath();ctx.arc(px+TILE/2+4,py+TILE/2-2,2,0,Math.PI*2);ctx.fill();
          }

          if (state.portals.some(p => p.x === x && p.y === y)) {
            ctx.strokeStyle = '#7f7bff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(px+TILE/2, py+TILE/2, 14, 0, Math.PI*2);
            ctx.stroke();
            ctx.lineWidth = 1;
          }

          if (state.spikes.has(key)) {
            ctx.fillStyle = '#7c7f90';
            for (let i=0;i<3;i++) {
              ctx.beginPath();
              ctx.moveTo(px+8+i*16, py+TILE-8);
              ctx.lineTo(px+16+i*16, py+10);
              ctx.lineTo(px+24+i*16, py+TILE-8);
              ctx.closePath();
              ctx.fill();
            }
          }

          if (state.goals.has(key)) {
            ctx.fillStyle = 'rgba(67,211,132,.25)';
            ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE/2, 16, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#43d384'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE/2, 11, 0, Math.PI*2); ctx.stroke();
          }
        }
      }

      for (const k of state.boxes) {
        const {x,y}=fromKey(k); const px=x*TILE, py=y*TILE;
        drawTile3D(x,y,'#e8b963','#b37d35');
        ctx.fillStyle = 'rgba(120,70,24,.45)';
        ctx.fillRect(px+8,py+10,TILE-16,TILE-20);
        ctx.strokeStyle = '#6b481d';
        ctx.beginPath(); ctx.moveTo(px+8,py+10); ctx.lineTo(px+TILE-8,py+TILE-10); ctx.stroke();

        if (state.deadlockedBoxes.has(k)) {
          ctx.strokeStyle = '#ff4e4e';
          ctx.lineWidth = 3;
          ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
          ctx.lineWidth = 1;
        }
      }

      const p = state.player;
      const px=p.x*TILE, py=p.y*TILE;
      drawTile3D(p.x,p.y,'#5ed0ff','#2f8faf');
      ctx.fillStyle='#e9faff';
      ctx.beginPath(); ctx.arc(px+TILE/2,py+20,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#17394f';
      ctx.beginPath(); ctx.arc(px+TILE/2-3,py+19,1.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px+TILE/2+3,py+19,1.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1f4e69';
      ctx.fillRect(px+20,py+30,20,14);
    }

    function updateHUD(){
      const totalBoxes = state.boxes.size;
      let done = 0;
      for (const g of state.goals) if (state.boxes.has(g)) done++;
      info.level.textContent = `关卡：${state.levelIndex+1} · ${LEVELS[state.levelIndex].name}`;
      info.box.textContent = `箱子：${totalBoxes}`;
      info.step.textContent = `步数：${state.steps}`;
      info.goal.textContent = `完成：${done}/${state.goals.size}`;
      info.prop.textContent = `道具：炸弹${state.bombs} / 传送${state.teleports}`;
      if (!state.failed && state.message === '状态：进行中' && state.deadlockedBoxes.size) state.message = '状态：警告，箱子可能卡死';
      if (isWin()) state.message = '状态：通关成功 🎉';
      info.state.textContent = state.message;
    }

    function useBomb(){
      if (state.bombs <= 0 || state.failed || isWin()) return;
      const dirs = [state.lastDir, {x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
      let target = null;
      for (const d of dirs) {
        const x = state.player.x + d.x;
        const y = state.player.y + d.y;
        const k = toKey(x,y);
        if (state.deadlockedBoxes.has(k)) { target = k; break; }
      }
      if (!target) {
        for (const d of dirs) {
          const x = state.player.x + d.x;
          const y = state.player.y + d.y;
          const k = toKey(x,y);
          if (state.boxes.has(k) && !state.goals.has(k)) { target = k; break; }
        }
      }
      if (!target) {
        state.message = '状态：附近没有可炸箱子';
        updateHUD();
        return;
      }
      pushHistory();
      state.boxes.delete(target);
      state.bombs--;
      state.message = '状态：炸弹生效，清除了一个箱子';
      computeDeadlocks();
      updateHUD();
      draw();
    }

    function useTeleport(){
      if (state.teleports <= 0 || state.failed || isWin()) return;
      const cells = [];
      for (let y=0; y<state.grid.length; y++) {
        for (let x=0; x<state.grid[0].length; x++) {
          if (isWall(x,y) || hasBox(x,y) || state.spikes.has(toKey(x,y))) continue;
          if (x === state.player.x && y === state.player.y) continue;
          cells.push({x,y});
        }
      }
      if (!cells.length) return;
      pushHistory();
      const target = cells[Math.floor(Math.random() * cells.length)];
      state.player = target;
      state.teleports--;
      state.message = '状态：传送成功';
      computeDeadlocks();
      updateHUD();
      draw();
    }

    function makeLevelButtons(){
      const wrap = document.getElementById('levelSelect');
      wrap.innerHTML = '';
      LEVELS.forEach((lv,idx)=>{
        const boxCount = lv.map.join('').split(TYPES.BOX).length - 1;
        const btn = document.createElement('button');
        btn.className = 'secondary';
        btn.textContent = `等级${idx+1}（${boxCount}箱）`;
        btn.onclick = () => loadLevel(idx);
        btn.dataset.level = idx;
        wrap.appendChild(btn);
      });
      refreshLevelButtons();
    }

    function refreshLevelButtons(){
      document.querySelectorAll('#levelSelect button').forEach(btn=>{
        btn.classList.toggle('active', Number(btn.dataset.level) === state.levelIndex);
      });
    }

    document.addEventListener('keydown', (e)=>{
      const k = e.key.toLowerCase();
      if (["arrowup","w"].includes(k)) move(0,-1);
      else if (["arrowdown","s"].includes(k)) move(0,1);
      else if (["arrowleft","a"].includes(k)) move(-1,0);
      else if (["arrowright","d"].includes(k)) move(1,0);
      else if (k === 'b') useBomb();
      else if (k === 't') useTeleport();
    });

    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      const t = e.changedTouches[0];
      touchStart = {x:t.clientX, y:t.clientY};
    }, {passive:true});

    canvas.addEventListener('touchend', e => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      const threshold = 24;
      if (Math.max(absX,absY) < threshold) return;
      if (absX > absY) move(dx > 0 ? 1 : -1, 0);
      else move(0, dy > 0 ? 1 : -1);
      touchStart = null;
    }, {passive:true});

    document.getElementById('restartBtn').onclick = () => loadLevel(state.levelIndex);
    document.getElementById('undoBtn').onclick = () => {
      const s = state.history.pop();
      if (s) restore(s);
    };
    document.getElementById('bombBtn').onclick = () => useBomb();
    document.getElementById('teleportBtn').onclick = () => useTeleport();
    document.getElementById('nextBtn').onclick = () => {
      loadLevel((state.levelIndex + 1) % LEVELS.length);
    };

    makeLevelButtons();
    loadLevel(0);
  </script>
